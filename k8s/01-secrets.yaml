apiVersion: v1
kind: Secret
metadata:
  name: idiot-secrets
  namespace: idiot
type: Opaque
stringData:
  # 数据库密码
  POSTGRES_PASSWORD: "postgres"
  # MinIO 凭证
  MINIO_ROOT_USER: "minio"
  MINIO_ROOT_PASSWORD: "minio_password"
  # JWT 密钥 - 生产环境请更换为随机字符串
  JWT_SECRET_KEY: "your-jwt-secret-key-change-in-production"
  # API Keys - 请替换为实际值
  DASHSCOPE_API_KEY: ""
  DEEPSEEK_API_KEY: ""
  # Langfuse 配置
  LANGFUSE_SECRET_KEY: ""
  LANGFUSE_PUBLIC_KEY: ""
  LANGFUSE_HOST: ""