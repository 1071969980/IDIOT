server {
    listen 8143;

    # 设置 CORS 变量（跨域请求）
    set $cors_origin "";
    # 如果请求来自对本地前端开发服务器的访问
    if ($http_origin ~* "^http://localhost:5173$") {
        set $cors_origin $http_origin;
    }
    # 如果请求来自 openvpn 局域网内访问k8s中本机暴露的前端服务即 10.8.0.***
    if ($http_origin ~* "^http://10\.8\.0\.\d{1-3}:31174$") {
        set $cors_origin $http_origin;
    }


    # 前端开发服务器 - 通过 K8s Service 访问宿主机
    # location / {
    #     proxy_pass http://host-docker-internal:5173;
    # }

    location /api/ {
        # 处理 OPTIONS 预检请求
        if ($request_method = 'OPTIONS') {
          add_header 'Access-Control-Allow-Origin' $cors_origin always;
          add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
          add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Connection,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With,Cookie' always;
          add_header 'Access-Control-Allow-Credentials' 'true' always;
          add_header 'Access-Control-Max-Age' 1728000 always;
          add_header 'Content-Type' 'text/plain charset=UTF-8' always;
          add_header 'Content-Length' 0 always;
          return 204;
        }

        proxy_pass http://api:8000;
        proxy_read_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # 添加 CORS 头部
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Connection,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With,Cookie' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # 允许最大 100MB 的请求体
        client_max_body_size 100M;
    }

    location /prometheus/ {
        proxy_pass http://prometheus:9090;
    }

    location /neo4j/ {
        proxy_pass http://neo4j:7474/browser;
    }
}