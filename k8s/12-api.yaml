# ServiceAccount for API
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: idiot
---
# Role for API to access user pods in idiot-user-space namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-user-pod-access
  namespace: idiot-user-space
rules:
  # Pod 查询和状态
  - apiGroups: [""]
    resources: ["pods", "pods/status"]
    verbs: ["get", "list", "watch"]
  # Pod 命令执行
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  # Pod 日志
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
# RoleBinding for API
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-user-pod-access
  namespace: idiot-user-space
subjects:
  - kind: ServiceAccount
    name: api
    namespace: idiot
roleRef:
  kind: Role
  name: api-user-pod-access
  apiGroup: rbac.authorization.k8s.io
---
# API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: idiot
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: api
      containers:
        - name: api
          image: idiot-api:latest
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["./api/run.sh"]
          envFrom:
            - configMapRef:
                name: idiot-config
            - secretRef:
                name: idiot-secrets
          ports:
            - containerPort: 8000
              name: http
          volumeMounts:
            - name: api-data
              mountPath: /app/volumes
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: api-data
          persistentVolumeClaim:
            claimName: api-pvc
---
# API Service
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: idiot
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    - name: debug
      port: 5678
      targetPort: 5678