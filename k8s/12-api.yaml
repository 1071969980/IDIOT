# API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: idiot
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: idiot-api:latest
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["./api/run.sh"]
          envFrom:
            - configMapRef:
                name: idiot-config
            - secretRef:
                name: idiot-secrets
          ports:
            - containerPort: 8000
              name: http
          volumeMounts:
            - name: api-data
              mountPath: /app/volumes
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: api-data
          persistentVolumeClaim:
            claimName: api-pvc
---
# API Service
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: idiot
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000