# 外部服务：宿主机服务访问
# 用于让 Pod 访问宿主机上运行的服务（如 Docker 部署的 langfuse）
# 等效于 Docker Compose 的 host.docker.internal

---
# Service 不带 selector，需要手动创建 Endpoints
apiVersion: v1
kind: Service
metadata:
  name: host-docker-internal
  namespace: idiot
spec:
  type: ClusterIP
  ports:
    - name: langfuse
      port: 3000
      targetPort: 3000
    - name: frontend-dev
      port: 5173
      targetPort: 5173
---
apiVersion: v1
kind: Endpoints
metadata:
  name: host-docker-internal
  namespace: idiot
subsets:
  - addresses:
      - ip: 192.168.71.29  # 宿主机 IP
    ports:
      - name: langfuse
        port: 3000
      - name: frontend-dev
        port: 5173