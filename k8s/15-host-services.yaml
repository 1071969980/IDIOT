# 外部服务：宿主机服务访问
# 用于让 Pod 访问宿主机上运行的服务（如 Docker 部署的 langfuse）
# 等效于 Docker Compose 的 host.docker.internal

---
# Service 不带 selector，需要手动创建 Endpoints
apiVersion: v1
kind: Service
metadata:
  name: host-docker-internal
  namespace: idiot
spec:
  type: ClusterIP
  ports:
    - name: langfuse
      port: 3000
      targetPort: 3000
    - name: frontend-dev
      port: 5173
      targetPort: 5173
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: host-docker-internal  # 可保持同名，但建议包含服务名后缀（如 -abc）
  namespace: idiot
  labels:
    kubernetes.io/service-name: host-docker-internal  # 必须添加此标签关联 Service
addressType: IPv4
ports:
  - name: langfuse
    protocol: TCP          # 原 Endpoints 未指定，默认为 TCP
    port: 3000
  - name: frontend-dev
    protocol: TCP
    port: 5173
endpoints:
  - addresses:
      - "192.168.71.29"
    conditions:
      ready: true          # 表示该端点可被路由流量