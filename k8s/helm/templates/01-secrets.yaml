apiVersion: v1
kind: Secret
metadata:
  name: idiot-secrets
  namespace: {{ include "idiot.namespace" . }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  JUICEFS_POSTGRES_PASSWORD: {{ .Values.secrets.juicefsPostgresPassword | quote }}
  MINIO_ROOT_USER: {{ .Values.secrets.minioRootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.secrets.minioRootPassword | quote }}
  JWT_SECRET_KEY: {{ .Values.secrets.jwtSecretKey | quote }}
  DASHSCOPE_API_KEY: {{ .Values.secrets.dashscopeApiKey | quote }}
  DEEPSEEK_API_KEY: {{ .Values.secrets.deepseekApiKey | quote }}
  ZHIPU_API_KEY: {{ .Values.secrets.zhipuApiKey | quote }}
  LANGFUSE_SECRET_KEY: {{ .Values.secrets.langfuseSecretKey | quote }}
  LANGFUSE_PUBLIC_KEY: {{ .Values.secrets.langfusePublicKey | quote }}
  LANGFUSE_HOST: {{ .Values.secrets.langfuseHost | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: storage-secrets
  namespace: {{ include "idiot.namespaceUserSpaceStorage" . }}
type: Opaque
stringData:
  MINIO_ROOT_USER: {{ .Values.secrets.minioRootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.secrets.minioRootPassword | quote }}
  JUICEFS_POSTGRES_PASSWORD: {{ .Values.secrets.juicefsPostgresPassword | quote }}
