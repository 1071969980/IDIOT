# Prometheus ConfigMap (从 configs/ 目录嵌入)
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ include "idiot.namespace" . }}
data:
  prometheus-config.yaml: |
{{ .Files.Get "configs/prometheus-config.yaml" | indent 4 }}
---
# Prometheus Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: {{ include "idiot.namespace" . }}
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: {{ .Values.images.prometheus }}
          args:
            - "--config.file=/config/prometheus-config.yaml"
            - "--storage.tsdb.path=/tmp/prometheus/data"
            - "--storage.tsdb.retention.time=7d"
            - "--web.external-url=/prometheus"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /config/prometheus-config.yaml
              subPath: prometheus-config.yaml
            - name: prometheus-data
              mountPath: /tmp/prometheus/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-data
          persistentVolumeClaim:
            claimName: prometheus-pvc
---
# Prometheus Service
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ include "idiot.namespace" . }}
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
