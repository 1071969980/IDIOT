# JuiceFS Silo Deployment
# 用于 User Pod 的 JuiceFS 数据存储。
# 资源名保持 juicefs-minio，以兼容应用配置、Service 名称和既有数据卷。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: juicefs-minio
  namespace: {{ include "idiot.namespaceUserSpaceStorage" . }}
  labels:
    app: juicefs-minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juicefs-minio
  template:
    metadata:
      labels:
        app: juicefs-minio
    spec:
      containers:
        - name: silo
          image: {{ .Values.images.silo }}
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            # Silo 沿用 MinIO 的 MINIO_* 环境变量契约
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: storage-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: storage-secrets
                  key: MINIO_ROOT_PASSWORD
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          startupProbe:
            httpGet:
              path: /minio/health/live
              port: api
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: juicefs-minio-data
              mountPath: /data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: juicefs-minio-data
          persistentVolumeClaim:
            claimName: juicefs-minio-pvc
---
# JuiceFS Silo Service（API 端口 9000，Console 端口 9001）
apiVersion: v1
kind: Service
metadata:
  name: juicefs-minio
  namespace: {{ include "idiot.namespaceUserSpaceStorage" . }}
spec:
  selector:
    app: juicefs-minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
