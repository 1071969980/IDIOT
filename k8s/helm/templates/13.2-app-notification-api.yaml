# App Notification API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-notification
  namespace: {{ include "idiot.namespace" . }}
  labels:
    app: app-notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-notification
  template:
    metadata:
      labels:
        app: app-notification
    spec:
      containers:
        - name: app-notification
          image: {{ .Values.images.api }}
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["./api/system_notification_app.sh"]
          envFrom:
            - configMapRef:
                name: idiot-config
            - secretRef:
                name: idiot-secrets
          ports:
            - containerPort: 8001
              name: http
            - containerPort: 5678
              name: debug
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
---
# App Notification Service
apiVersion: v1
kind: Service
metadata:
  name: app-notification
  namespace: {{ include "idiot.namespace" . }}
spec:
  selector:
    app: app-notification
  ports:
    - name: http
      port: 8001
      targetPort: 8001
    - name: debug
      port: 5678
      targetPort: 5678
