# Prometheus NodePort
apiVersion: v1
kind: Service
metadata:
  name: prometheus-external
  namespace: {{ include "idiot.namespace" . }}
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: {{ .Values.nodePorts.prometheus }}
---
# Nginx NodePort
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: {{ include "idiot.namespace" . }}
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 8143
      targetPort: 8143
      nodePort: {{ .Values.nodePorts.nginx }}
