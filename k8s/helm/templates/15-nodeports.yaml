# Postgres NodePort
apiVersion: v1
kind: Service
metadata:
  name: postgres-external
  namespace: {{ include "idiot.namespace" . }}
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      nodePort: {{ .Values.nodePorts.postgres }}
---
# JuiceFS Postgres NodePort
apiVersion: v1
kind: Service
metadata:
  name: juicefs-postgres-external
  namespace: {{ include "idiot.namespaceUserSpaceStorage" . }}
spec:
  type: NodePort
  selector:
    app: juicefs-postgres
  ports:
    - port: 5432
      targetPort: 5432
      nodePort: {{ .Values.nodePorts.juicefsPostgres }}
---
# Minio Console NodePort
apiVersion: v1
kind: Service
metadata:
  name: minio-external
  namespace: {{ include "idiot.namespace" . }}
spec:
  type: NodePort
  selector:
    app: minio
  ports:
    - port: 9001
      targetPort: 9001
      nodePort: {{ .Values.nodePorts.minio }}
---
# JuiceFS Minio Console NodePort
apiVersion: v1
kind: Service
metadata:
  name: juicefs-minio-external
  namespace: {{ include "idiot.namespaceUserSpaceStorage" . }}
spec:
  type: NodePort
  selector:
    app: juicefs-minio
  ports:
    - port: 9001
      targetPort: 9001
      nodePort: {{ .Values.nodePorts.juicefsMinio }}
---
# Nginx NodePort
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: {{ include "idiot.namespace" . }}
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 8143
      targetPort: 8143
      nodePort: {{ .Values.nodePorts.nginx }}
