# PostgreSQL 持久化存储
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.namespacePrefix }}postgres-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ .Values.storage.className }}
  hostPath:
    path: {{ include "idiot.storageBasePath" . }}/postgres
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: {{ include "idiot.namespace" . }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.storage.className }}
  resources:
    requests:
      storage: 10Gi
  volumeName: idiot-{{ .Values.namespacePrefix }}postgres-pv
---
