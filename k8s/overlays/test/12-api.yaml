apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: test-idiot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-user-pod-access
  namespace: test-idiot-user-space
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - pods/status
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods/exec
  verbs:
  - get
  - create
- apiGroups:
  - ""
  resources:
  - pods/log
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-user-pod-access
  namespace: test-idiot-user-space
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: api-user-pod-access
subjects:
- kind: ServiceAccount
  name: api
  namespace: test-idiot
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: test-idiot
spec:
  ports:
  - name: http
    port: 8000
    targetPort: 8000
  - name: debug
    port: 5678
    targetPort: 5678
  selector:
    app: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: api
  name: api
  namespace: test-idiot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - command:
        - ./api/run.sh
        envFrom:
        - configMapRef:
            name: idiot-config
        - secretRef:
            name: idiot-secrets
        image: idiot-api:latest
        imagePullPolicy: IfNotPresent
        name: api
        ports:
        - containerPort: 8000
          name: http
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
          requests:
            cpu: 200m
            memory: 512Mi
        volumeMounts:
        - mountPath: /app/volumes
          name: api-data
        workingDir: /app
      serviceAccountName: api
      volumes:
      - name: api-data
        persistentVolumeClaim:
          claimName: api-pvc
