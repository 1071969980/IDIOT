apiVersion: v1
kind: Service
metadata:
  name: host-docker-internal
  namespace: test-idiot
spec:
  ports:
  - name: langfuse
    port: 3000
    targetPort: 3000
  - name: frontend-dev
    port: 5173
    targetPort: 5173
  type: ClusterIP
---
addressType: IPv4
apiVersion: discovery.k8s.io/v1
endpoints:
- addresses:
  - 192.168.71.29
  conditions:
    ready: true
kind: EndpointSlice
metadata:
  labels:
    kubernetes.io/service-name: host-docker-internal
  name: host-docker-internal
  namespace: test-idiot
ports:
- name: langfuse
  port: 3000
  protocol: TCP
- name: frontend-dev
  port: 5173
  protocol: TCP
