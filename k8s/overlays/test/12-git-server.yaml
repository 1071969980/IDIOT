apiVersion: v1
kind: Service
metadata:
  name: git-server
  namespace: test-idiot
spec:
  ports:
  - name: ssh
    port: 22
    targetPort: 22
  selector:
    app: git-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: git-server
  name: git-server
  namespace: test-idiot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: git-server
  template:
    metadata:
      labels:
        app: git-server
    spec:
      containers:
      - image: idiot-git-server
        name: git-server
        ports:
        - containerPort: 22
          name: ssh
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
