apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  # 重命名 Namespace 资源
  - patch: |-
      - op: replace
        path: /metadata/name
        value: test-idiot
    target:
      kind: Namespace
      name: idiot

  - patch: |-
      - op: replace
        path: /metadata/name
        value: test-idiot-user-space
    target:
      kind: Namespace
      name: idiot-user-space

  - patch: |-
      - op: replace
        path: /metadata/name
        value: test-idiot-user-space-storage
    target:
      kind: Namespace
      name: idiot-user-space-storage

  # 修改所有 namespace: idiot 的资源
  - patch: |-
      - op: replace
        path: /metadata/namespace
        value: test-idiot
    target:
      namespace: idiot

  # 修改所有 namespace: idiot-user-space 的资源
  - patch: |-
      - op: replace
        path: /metadata/namespace
        value: test-idiot-user-space
    target:
      namespace: idiot-user-space

  # 修改所有 namespace: idiot-user-space-storage 的资源
  - patch: |-
      - op: replace
        path: /metadata/namespace
        value: test-idiot-user-space-storage
    target:
      namespace: idiot-user-space-storage

  # 修改 RoleBinding 中的 subjects.namespace
  - patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: test-idiot
    target:
      kind: RoleBinding
      name: user-pod-scheduler

  - patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: test-idiot
    target:
      kind: RoleBinding
      name: api-user-pod-access

  # 修改 ClusterRoleBinding 中的 subjects.namespace
  - patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: test-idiot
    target:
      kind: ClusterRoleBinding
      name: user-pod-scheduler-storageclasses

  # 修改 ConfigMap 内容
  - patch: |-
      - op: replace
        path: /data/K8S_NAMESPACE_APP
        value: test-idiot
      - op: replace
        path: /data/K8S_NAMESPACE_USER_SPACE
        value: test-idiot-user-space
      - op: replace
        path: /data/K8S_NAMESPACE_USER_SPACE_STORAGE
        value: test-idiot-user-space-storage
    target:
      kind: ConfigMap
      name: idiot-config

  # 修改 NodePort 端口号避免与生产环境冲突
  - patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 31090
    target:
      kind: Service
      name: prometheus-external

  - patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 31143
    target:
      kind: Service
      name: nginx

  # ===========================================
  # PersistentVolume 重命名和 hostPath 修改
  # ===========================================

  - patch: |-
      - op: replace
        path: /metadata/name
        value: test-postgres-pv
      - op: replace
        path: /spec/hostPath/path
        value: /home/gmh/桌面/IDIOT/k8s/volumes/test/postgres
    target:
      kind: PersistentVolume
      name: postgres-pv

  - patch: |-
      - op: replace
        path: /metadata/name
        value: test-redis-pv
      - op: replace
        path: /spec/hostPath/path
        value: /home/gmh/桌面/IDIOT/k8s/volumes/test/redis
    target:
      kind: PersistentVolume
      name: redis-pv

  - patch: |-
      - op: replace
        path: /metadata/name
        value: test-weaviate-pv
      - op: replace
        path: /spec/hostPath/path
        value: /home/gmh/桌面/IDIOT/k8s/volumes/test/weaviate
    target:
      kind: PersistentVolume
      name: weaviate-pv

  - patch: |-
      - op: replace
        path: /metadata/name
        value: test-minio-pv
      - op: replace
        path: /spec/hostPath/path
        value: /home/gmh/桌面/IDIOT/k8s/volumes/test/minio
    target:
      kind: PersistentVolume
      name: minio-pv

  - patch: |-
      - op: replace
        path: /metadata/name
        value: test-neo4j-pv
      - op: replace
        path: /spec/hostPath/path
        value: /home/gmh/桌面/IDIOT/k8s/volumes/test/neo4j
    target:
      kind: PersistentVolume
      name: neo4j-pv

  - patch: |-
      - op: replace
        path: /metadata/name
        value: test-prometheus-pv
      - op: replace
        path: /spec/hostPath/path
        value: /home/gmh/桌面/IDIOT/k8s/volumes/test/prometheus
    target:
      kind: PersistentVolume
      name: prometheus-pv

  - patch: |-
      - op: replace
        path: /metadata/name
        value: test-api-pv
      - op: replace
        path: /spec/hostPath/path
        value: /home/gmh/桌面/IDIOT/k8s/volumes/test/api
    target:
      kind: PersistentVolume
      name: api-pv

  - patch: |-
      - op: replace
        path: /metadata/name
        value: test-juicefs-minio-pv
      - op: replace
        path: /spec/hostPath/path
        value: /home/gmh/桌面/IDIOT/k8s/volumes/test/juicefs-minio
    target:
      kind: PersistentVolume
      name: juicefs-minio-pv

  - patch: |-
      - op: replace
        path: /metadata/name
        value: test-juicefs-postgres-pv
      - op: replace
        path: /spec/hostPath/path
        value: /home/gmh/桌面/IDIOT/k8s/volumes/test/juicefs-postgres
    target:
      kind: PersistentVolume
      name: juicefs-postgres-pv

  # ===========================================
  # PersistentVolumeClaim volumeName 更新
  # ===========================================

  - patch: |-
      - op: replace
        path: /spec/volumeName
        value: test-postgres-pv
    target:
      kind: PersistentVolumeClaim
      name: postgres-pvc

  - patch: |-
      - op: replace
        path: /spec/volumeName
        value: test-redis-pv
    target:
      kind: PersistentVolumeClaim
      name: redis-pvc

  - patch: |-
      - op: replace
        path: /spec/volumeName
        value: test-weaviate-pv
    target:
      kind: PersistentVolumeClaim
      name: weaviate-pvc

  - patch: |-
      - op: replace
        path: /spec/volumeName
        value: test-minio-pv
    target:
      kind: PersistentVolumeClaim
      name: minio-pvc

  - patch: |-
      - op: replace
        path: /spec/volumeName
        value: test-neo4j-pv
    target:
      kind: PersistentVolumeClaim
      name: neo4j-pvc

  - patch: |-
      - op: replace
        path: /spec/volumeName
        value: test-prometheus-pv
    target:
      kind: PersistentVolumeClaim
      name: prometheus-pvc

  - patch: |-
      - op: replace
        path: /spec/volumeName
        value: test-api-pv
    target:
      kind: PersistentVolumeClaim
      name: api-pvc

  - patch: |-
      - op: replace
        path: /spec/volumeName
        value: test-juicefs-minio-pv
    target:
      kind: PersistentVolumeClaim
      name: juicefs-minio-pvc

  - patch: |-
      - op: replace
        path: /spec/volumeName
        value: test-juicefs-postgres-pv
    target:
      kind: PersistentVolumeClaim
      name: juicefs-postgres-pvc

  # ===========================================
  # ClusterRole 重命名
  # ===========================================

  - patch: |-
      - op: replace
        path: /metadata/name
        value: test-user-pod-scheduler-storageclasses
    target:
      kind: ClusterRole
      name: user-pod-scheduler-storageclasses

  # ===========================================
  # ClusterRoleBinding 重命名和更新引用
  # ===========================================

  - patch: |-
      - op: replace
        path: /metadata/name
        value: test-user-pod-scheduler-storageclasses
      - op: replace
        path: /roleRef/name
        value: test-user-pod-scheduler-storageclasses
    target:
      kind: ClusterRoleBinding
      name: user-pod-scheduler-storageclasses