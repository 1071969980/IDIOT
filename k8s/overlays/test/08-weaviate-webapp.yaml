apiVersion: v1
kind: Service
metadata:
  name: weaviate-webapp
  namespace: test-idiot
spec:
  ports:
  - port: 8501
    targetPort: 8501
  selector:
    app: weaviate-webapp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: weaviate-webapp
  name: weaviate-webapp
  namespace: test-idiot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weaviate-webapp
  template:
    metadata:
      labels:
        app: weaviate-webapp
    spec:
      containers:
      - image: weaviateclusterapp:latest
        imagePullPolicy: IfNotPresent
        name: weaviate-webapp
        ports:
        - containerPort: 8501
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
