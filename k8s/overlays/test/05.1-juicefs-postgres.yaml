apiVersion: v1
kind: Service
metadata:
  name: juicefs-postgres
  namespace: test-idiot-user-space-storage
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: juicefs-postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: juicefs-postgres
  name: juicefs-postgres
  namespace: test-idiot-user-space-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juicefs-postgres
  template:
    metadata:
      labels:
        app: juicefs-postgres
    spec:
      containers:
      - env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: JUICEFS_POSTGRES_PASSWORD
              name: storage-secrets
        - name: POSTGRES_DB
          value: juicefs
        image: postgres:18-alpine
        name: postgres
        ports:
        - containerPort: 5432
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - mountPath: /var/lib/postgresql
          name: juicefs-postgres-data
      volumes:
      - name: juicefs-postgres-data
        persistentVolumeClaim:
          claimName: juicefs-postgres-pvc
