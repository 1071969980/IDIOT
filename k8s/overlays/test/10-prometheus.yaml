apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: test-idiot
spec:
  ports:
  - port: 9090
    targetPort: 9090
  selector:
    app: prometheus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: prometheus
  name: prometheus
  namespace: test-idiot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - args:
        - --config.file=/config/prometheus-config.yaml
        - --storage.tsdb.path=/tmp/prometheus/data
        - --storage.tsdb.retention.time=7d
        - --web.external-url=/prometheus
        image: prom/prometheus:v3.4.2
        name: prometheus
        ports:
        - containerPort: 9090
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - mountPath: /config/prometheus-config.yaml
          name: prometheus-config
          subPath: prometheus-config.yaml
        - mountPath: /tmp/prometheus/data
          name: prometheus-data
      volumes:
      - hostPath:
          path: /home/gmh/桌面/IDIOT/k8s/configs
          type: Directory
        name: prometheus-config
      - name: prometheus-data
        persistentVolumeClaim:
          claimName: prometheus-pvc
