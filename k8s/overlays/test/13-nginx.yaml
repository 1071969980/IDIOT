apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginx
  name: nginx
  namespace: test-idiot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - image: nginx:1.29.5
        name: nginx
        ports:
        - containerPort: 8143
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - mountPath: /etc/nginx/conf.d/default.conf
          name: nginx-config
          subPath: nginx-default.conf
        - mountPath: /etc/nginx/snippets/proxy_cors.inc
          name: nginx-config
          subPath: proxy_cors.inc
        - mountPath: /etc/nginx/ssl
          name: nginx-ssl
      volumes:
      - hostPath:
          path: /home/gmh/桌面/IDIOT/k8s/configs
          type: Directory
        name: nginx-config
      - hostPath:
          path: /home/gmh/桌面/IDIOT/nginx/ssl
          type: Directory
        name: nginx-ssl
