apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: otel-collector
  name: otel-collector
  namespace: test-idiot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
      - args:
        - --config=/etc/otelcol/otel-collector-config.yml
        env:
        - name: LANGFUSE_ENDPOINT
          value: http://host-docker-internal:3000/api/public/otel
        - name: LANGFUSE_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              key: LANGFUSE_PUBLIC_KEY
              name: idiot-secrets
        - name: LANGFUSE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: LANGFUSE_SECRET_KEY
              name: idiot-secrets
        image: otel/opentelemetry-collector-contrib:0.128.0
        name: otel-collector
        ports:
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 4318
          name: otlp-http
        - containerPort: 8889
          name: prometheus
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - mountPath: /etc/otelcol/otel-collector-config.yml
          name: otel-config
          subPath: otel-collector-config-connector.yml
      volumes:
      - hostPath:
          path: /home/gmh/桌面/IDIOT/k8s/configs
          type: Directory
        name: otel-config
