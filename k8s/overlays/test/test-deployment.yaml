apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: juicefs-minio
  name: juicefs-minio
  namespace: test-idiot-user-space-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juicefs-minio
  template:
    metadata:
      labels:
        app: juicefs-minio
    spec:
      containers:
      - args:
        - server
        - /data
        - --console-address
        - :9001
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              key: MINIO_ROOT_USER
              name: storage-secrets
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              key: MINIO_ROOT_PASSWORD
              name: storage-secrets
        image: minio/minio:latest
        name: minio
        ports:
        - containerPort: 9000
          name: api
        - containerPort: 9001
          name: console
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - mountPath: /data
          name: juicefs-minio-data
      volumes:
      - name: juicefs-minio-data
        persistentVolumeClaim:
          claimName: juicefs-minio-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: juicefs-postgres
  name: juicefs-postgres
  namespace: test-idiot-user-space-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juicefs-postgres
  template:
    metadata:
      labels:
        app: juicefs-postgres
    spec:
      containers:
      - env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: JUICEFS_POSTGRES_PASSWORD
              name: storage-secrets
        - name: POSTGRES_DB
          value: juicefs
        image: postgres:18-alpine
        name: postgres
        ports:
        - containerPort: 5432
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - mountPath: /var/lib/postgresql
          name: juicefs-postgres-data
      volumes:
      - name: juicefs-postgres-data
        persistentVolumeClaim:
          claimName: juicefs-postgres-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: api
  name: api
  namespace: test-idiot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - command:
        - ./api/run.sh
        envFrom:
        - configMapRef:
            name: idiot-config
        - secretRef:
            name: idiot-secrets
        image: idiot-api:latest
        imagePullPolicy: IfNotPresent
        name: api
        ports:
        - containerPort: 8000
          name: http
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
          requests:
            cpu: 200m
            memory: 512Mi
        volumeMounts:
        - mountPath: /app/volumes
          name: api-data
        workingDir: /app
      serviceAccountName: api
      volumes:
      - name: api-data
        persistentVolumeClaim:
          claimName: api-pvc
---
