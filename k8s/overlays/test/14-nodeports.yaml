apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: test-idiot
spec:
  ports:
  - nodePort: 31143
    port: 8143
    targetPort: 8143
  selector:
    app: nginx
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-external
  namespace: test-idiot
spec:
  ports:
  - nodePort: 31090
    port: 9090
    targetPort: 9090
  selector:
    app: prometheus
  type: NodePort
