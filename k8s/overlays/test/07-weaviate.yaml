apiVersion: v1
kind: Service
metadata:
  name: weaviate
  namespace: test-idiot
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: weaviate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: weaviate
  name: weaviate
  namespace: test-idiot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weaviate
  template:
    metadata:
      labels:
        app: weaviate
    spec:
      containers:
      - args:
        - --host
        - 0.0.0.0
        - --port
        - "8080"
        - --scheme
        - http
        env:
        - name: QUERY_DEFAULTS_LIMIT
          value: "25"
        - name: AUTOSCHEMA_ENABLED
          value: "false"
        - name: AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED
          value: "true"
        - name: PERSISTENCE_DATA_PATH
          value: /var/lib/weaviate
        - name: ENABLE_API_BASED_MODULES
          value: "true"
        - name: CLUSTER_HOSTNAME
          value: node1
        - name: ASYNC_INDEXING
          value: "true"
        image: cr.weaviate.io/semitechnologies/weaviate:1.32.0
        name: weaviate
        ports:
        - containerPort: 8080
          name: http
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
          requests:
            cpu: 200m
            memory: 512Mi
        volumeMounts:
        - mountPath: /var/lib/weaviate
          name: weaviate-data
      volumes:
      - name: weaviate-data
        persistentVolumeClaim:
          claimName: weaviate-pvc
