# Weaviate Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weaviate
  namespace: idiot
  labels:
    app: weaviate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weaviate
  template:
    metadata:
      labels:
        app: weaviate
    spec:
      containers:
        - name: weaviate
          image: cr.weaviate.io/semitechnologies/weaviate:1.32.0
          args:
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--scheme"
            - "http"
          env:
            - name: QUERY_DEFAULTS_LIMIT
              value: "25"
            - name: AUTOSCHEMA_ENABLED
              value: "false"
            - name: AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED
              value: "true"
            - name: PERSISTENCE_DATA_PATH
              value: "/var/lib/weaviate"
            - name: ENABLE_API_BASED_MODULES
              value: "true"
            - name: CLUSTER_HOSTNAME
              value: "node1"
            - name: ASYNC_INDEXING
              value: "true"
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: weaviate-data
              mountPath: /var/lib/weaviate
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: weaviate-data
          persistentVolumeClaim:
            claimName: weaviate-pvc
---
# Weaviate Service
apiVersion: v1
kind: Service
metadata:
  name: weaviate
  namespace: idiot
spec:
  selector:
    app: weaviate
  ports:
    - name: http
      port: 8080
      targetPort: 8080