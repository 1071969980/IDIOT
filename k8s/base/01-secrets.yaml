apiVersion: v1
kind: Secret
metadata:
  name: idiot-secrets
  namespace: idiot
type: Opaque
stringData:
  # 数据库密码
  POSTGRES_PASSWORD: "postgres"
  # JuiceFS PostgreSQL 密码
  JUICEFS_POSTGRES_PASSWORD: "juicefs-postgres"
  # MinIO 凭证
  MINIO_ROOT_USER: "minio"
  MINIO_ROOT_PASSWORD: "minio_password"
  # JWT 密钥 - 生产环境请更换为随机字符串
  JWT_SECRET_KEY: "5f7ca604-319e-403d-9ed2-4c46e3fc4721"
  # API Keys - 请替换为实际值
  DASHSCOPE_API_KEY: ""
  DEEPSEEK_API_KEY: ""
  ZHIPU_API_KEY: ""
  # Langfuse 配置
  LANGFUSE_SECRET_KEY: ""
  LANGFUSE_PUBLIC_KEY: ""
  LANGFUSE_HOST: "http://host-docker-internal:3000"
---
# idiot-user-space-storage 命名空间的 Secrets
apiVersion: v1
kind: Secret
metadata:
  name: storage-secrets
  namespace: idiot-user-space-storage
type: Opaque
stringData:
  # MinIO 凭证（与 idiot 命名空间相同）
  MINIO_ROOT_USER: "minio"
  MINIO_ROOT_PASSWORD: "minio_password"
  # JuiceFS PostgreSQL 密码（与 idiot 命名空间相同）
  JUICEFS_POSTGRES_PASSWORD: "juicefs-postgres"