# Git Server (Gitolite) Deployment
# 内部 Git 服务，为用户容器提供 Git 仓库访问
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-server
  namespace: idiot
  labels:
    app: git-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: git-server
  template:
    metadata:
      labels:
        app: git-server
    spec:
      containers:
        - name: git-server
          image: idiot-git-server
          ports:
            - containerPort: 22
              name: ssh
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
# Git Server Service
apiVersion: v1
kind: Service
metadata:
  name: git-server
  namespace: idiot
spec:
  selector:
    app: git-server
  ports:
    - name: ssh
      port: 22
      targetPort: 22
