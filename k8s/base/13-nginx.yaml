# Nginx Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: idiot
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.29.5
          ports:
            - containerPort: 8143
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx-default.conf
            - name: nginx-config
              mountPath: /etc/nginx/snippets/proxy_cors.inc
              subPath: proxy_cors.inc
            - name: nginx-ssl
              mountPath: /etc/nginx/ssl
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: nginx-config
          hostPath:
            path: /home/gmh/桌面/IDIOT/k8s/configs
            type: Directory
        - name: nginx-ssl
          hostPath:
            path: /home/gmh/桌面/IDIOT/nginx/ssl
            type: Directory