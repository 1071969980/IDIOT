apiVersion: v1
kind: ConfigMap
metadata:
  name: idiot-config
  namespace: idiot
data:
  # API 配置
  API_DEBUG: "1"
  API_DEBUG_PORT: "5678"
  USER_POD_IMAGE: "python:3.13"
  CACHE_DIR: "/app/volumes"
  # OTEL 配置 (服务名使用连字符，与 K8s Service 名称一致)
  LOGFIRE_LOG_ENDPOINT: "http://otel-collector:4318"
  # 命名空间配置
  K8S_NAMESPACE_APP: "idiot"
  K8S_NAMESPACE_USER_SPACE: "idiot-user-space"
  K8S_NAMESPACE_USER_SPACE_STORAGE: "idiot-user-space-storage"
  # 服务端点配置
  K8S_SERVICE_CLUSTER_DOMAIN: "svc.cluster.local"
  K8S_SERVICE_JUICEFS_POSTGRES_NAME: "juicefs-postgres"
  K8S_SERVICE_JUICEFS_MINIO_NAME: "juicefs-minio"